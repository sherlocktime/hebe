<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Composición Pro v4.2</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: white; font-family: sans-serif; overflow: hidden; height: 100dvh; }
        #container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; touch-action: none; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; z-index: 2; pointer-events: auto; }

        #top-ui {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top, 0px));
            left: 0; right: 0;
            z-index: 30;
            display: none;
            gap: 8px;
            padding: 0 15px;
            pointer-events: none;
            justify-content: center;
            align-items: center;
        }

        .ui-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            height: 44px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        #btn-grid { flex: 1; max-width: 160px; padding: 0 10px; }
        #btn-color { width: 44px; padding: 0; }
        #color-dot { width: 14px; height: 14px; border-radius: 50%; background: white; border: 1.5px solid rgba(255,255,255,0.4); }
        #btn-reset { width: 44px; font-size: 20px; }
        #btn-upload { width: 44px; font-size: 18px; }

        #mainActionBtn { position: absolute; z-index: 40; padding: 18px 40px; font-size: 16px; border-radius: 30px; border: none; background: white; color: black; font-weight: bold; }

        .controls-area {
            position: fixed;
            bottom: calc(30px + env(safe-area-inset-bottom, 0px));
            width: 100%;
            display: none;
            justify-content: center;
            pointer-events: none;
            z-index: 50;
        }

        #btn-shutter {
            width: 72px; height: 72px; border-radius: 50%; border: 4px solid white;
            background: transparent; cursor: pointer; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box; outline: none; padding: 0;
        }

        #btn-shutter-inner {
            width: 54px; height: 54px; background: white; border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #btn-shutter.is-frozen #btn-shutter-inner { background: #007AFF; transform: scale(0.85); }

        #file-input { display: none; }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <button id="mainActionBtn">COMENZAR</button>

    <div id="top-ui">
        <button id="btn-grid" class="ui-btn">Regla de Tercios</button>
        <button id="btn-upload" class="ui-btn" title="Cargar Imagen">&#128443;</button>
        <button id="btn-color" class="ui-btn"><div id="color-dot"></div></button>
        <button id="btn-reset" class="ui-btn" title="Reset">&#8864;</button>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <div class="controls-area" id="controls-area">
        <button id="btn-shutter"><div id="btn-shutter-inner"></div></button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const freezeCanvas = document.createElement('canvas');
    const fCtx = freezeCanvas.getContext('2d');
    const fileInput = document.getElementById('file-input');

    const grids = ['tercios', 'golden', 'tri-aureos-a', 'tri-aureos-b', 'puntos-fuerza', 'cuadrado', 'fuga', 'fibonacci-a', 'fibonacci-b', 'simetria', 'diagonales'];
    const gridLabels = ['Regla de Tercios', 'Proporción Áurea', 'Triángulos Áureos A', 'Triángulos Áureos B', 'Puntos de Fuerza', 'Encuadre Cuadrado', '1 Punto de Fuga', 'Fibo Rects Der', 'Fibo Rects Izq', 'Simetría Central', 'Diagonales'];
    let gIdx = 0, cIdx = 0, isRunning = false, isFrozen = false, isDragging = false;
    let marginX = 0.05, borderY = 0.25, dragMode = "frame", fugaX = 0.5, fugaY = 0.5, lastFrameTime = 0;
    const colors = ['#FFFFFF', '#FF3B30', '#4CD964', '#FFCC00', '#007AFF'], fpsLimit = 30;

    document.getElementById('btn-upload').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                // Rotación automática si es horizontal
                if (img.width > img.height) {
                    freezeCanvas.width = img.height;
                    freezeCanvas.height = img.width;
                    fCtx.save();
                    fCtx.translate(freezeCanvas.width / 2, freezeCanvas.height / 2);
                    fCtx.rotate(90 * Math.PI / 180);
                    fCtx.drawImage(img, -img.width / 2, -img.height / 2);
                    fCtx.restore();
                } else {
                    freezeCanvas.width = img.width;
                    freezeCanvas.height = img.height;
                    fCtx.drawImage(img, 0, 0);
                }
                isFrozen = true;
                document.getElementById('btn-shutter').classList.add('is-frozen');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function handleStart(e) {
        if (!isRunning) return;
        isDragging = true;
        const rect = canvas.getBoundingClientRect();
        const touchY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        if (grids[gIdx] === 'fuga') {
            const currentBorderPixel = window.innerHeight * borderY;
            dragMode = (touchY < currentBorderPixel + 60 || touchY > (window.innerHeight - currentBorderPixel - 60)) ? "frame" : "fuga";
        } else { dragMode = "frame"; }
    }

    function handleMove(e) {
        if (!isDragging || !isRunning) return;
        const rect = canvas.getBoundingClientRect();
        const tX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const tY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        const W = window.innerWidth, H = window.innerHeight;
        const rectW = W * (1 - 2 * marginX), rectH = H * (1 - 2 * borderY);
        if (dragMode === "frame") {
            let nY = tY / H; if (nY > 0.5) nY = 1 - nY;
            borderY = Math.max(0.01, Math.min(0.48, nY));
        } else {
            fugaX = (tX - (W * marginX)) / rectW;
            fugaY = (tY - (H * borderY)) / rectH;
        }
    }

    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', () => isDragging = false);
    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', (e) => isDragging && handleMove(e));
    window.addEventListener('mouseup', () => isDragging = false);

    function render(now) {
        if (!isRunning) return;
        if (now - lastFrameTime < (1000 / fpsLimit)) { requestAnimationFrame(render); return; }
        lastFrameTime = now;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const W = canvas.width, H = canvas.height;
        const rectW = W * (1 - 2 * marginX), rectH = H * (1 - 2 * borderY);
        const x = W * marginX, y = H * borderY;

        ctx.clearRect(0, 0, W, H);

        if (isFrozen) {
            // Fondo oscuro total tras perder fullscreen
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            // LOGICA "FIT": Dibujar la foto para que quepa dentro del rectW y rectH
            const imgW = freezeCanvas.width;
            const imgH = freezeCanvas.height;
            const ratioImg = imgW / imgH;
            const ratioRect = rectW / rectH;

            let drawW, drawH, drawX, drawY;

            if (ratioImg > ratioRect) {
                // La imagen es proporcionalmente más ancha que el marco
                drawW = rectW;
                drawH = rectW / ratioImg;
                drawX = x;
                drawY = y + (rectH - drawH) / 2;
            } else {
                // La imagen es proporcionalmente más alta que el marco
                drawH = rectH;
                drawW = rectH * ratioImg;
                drawX = x + (rectW - drawW) / 2;
                drawY = y;
            }

            // Dibujamos la imagen ajustada
            ctx.drawImage(freezeCanvas, drawX, drawY, drawW, drawH);
        } else {
            // Modo cámara en vivo (Cover normal para inmersión)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(x, y, rectW, rectH);
            ctx.globalCompositeOperation = 'source-over';
        }

        // Grillas siempre alineadas al marco de análisis
        ctx.save();
        ctx.beginPath(); ctx.rect(x, y, rectW, rectH); ctx.clip();
        ctx.strokeStyle = colors[cIdx]; ctx.fillStyle = colors[cIdx]; ctx.lineWidth = 1.5;
        dibujarGrilla(grids[gIdx], x, y, rectW, rectH);
        ctx.restore();

        // Marco y Manijas
        ctx.strokeStyle = colors[cIdx]; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, rectW, rectH);
        ctx.fillStyle = colors[cIdx]; ctx.globalAlpha = 0.6;
        ctx.fillRect(W/2 - 30, y - 3, 60, 6); ctx.fillRect(W/2 - 30, y + rectH - 3, 60, 6);
        ctx.globalAlpha = 1.0;

        requestAnimationFrame(render);
    }

    function dibujarGrilla(mode, x, y, rectW, rectH) {
        ctx.setLineDash([]);
        if (mode === 'fuga') {
            const fx = x + rectW * fugaX, fy = y + rectH * fugaY;
            ctx.setLineDash([6, 4]); line(x-2000, fy, x+rectW+2000, fy); line(fx, y-2000, fx, y+rectH+2000);
            ctx.setLineDash([]); line(x, y, fx, fy); line(x + rectW, y, fx, fy);
            line(x, y + rectH, fx, fy); line(x + rectW, y + rectH, fx, fy);
            ctx.beginPath(); ctx.arc(fx, fy, 4, 0, 7); ctx.fill();
        } else if (mode === 'tercios') {
            for(let i=1; i<3; i++) { line(x + rectW*i/3, y, x + rectW*i/3, y + rectH); line(x, y + rectH*i/3, x + rectW, y + rectH*i/3); }
        } else if (mode.startsWith('fibonacci')) {
            const isB = mode === 'fibonacci-b'; let cX = x, cY = y, cW = rectW, cH = rectH;
            for (let i = 0; i < 7; i++) {
                let s = Math.min(cW, cH); const st = i % 4;
                if (st === 0) { ctx.strokeRect(cX, cY + cH - s, cW, s); cH -= s; }
                else if (st === 1) { if (!isB) { ctx.strokeRect(cX + cW - s, cY, s, cH); cW -= s; } else { ctx.strokeRect(cX, cY, s, cH); cX += s; cW -= s; } }
                else if (st === 2) { ctx.strokeRect(cX, cY, cW, s); cY += s; cH -= s; }
                else if (st === 3) { if (!isB) { ctx.strokeRect(cX, cY, s, cH); cX += s; cW -= s; } else { ctx.strokeRect(cX + cW - s, cY, s, cH); cW -= s; } }
                if (cW < 4 || cH < 4) break;
            }
        } else if (mode === 'cuadrado') { const s = Math.min(rectW, rectH); ctx.strokeRect(x + (rectW-s)/2, y + (rectH-s)/2, s, s); }
        else if (mode === 'simetria') { line(x + rectW/2, y, x + rectW/2, y + rectH); line(x, y + rectH/2, x + rectW, y + rectH/2); }
        else if (mode === 'golden') {
            const p = 0.618; line(x+rectW*p, y, x+rectW*p, y+rectH); line(x+rectW*(1-p), y, x+rectW*(1-p), y+rectH);
            line(x, y+rectH*p, x+rectW, y+rectH*p); line(x, y+rectH*(1-p), x+rectW, y+rectH*(1-p));
        } else if (mode === 'diagonales') { line(x, y, x+rectW, y+rectH); line(x+rectW, y, x, y+rectH); }
        else if (mode.startsWith('tri-aureos')) {
            const isA = mode === 'tri-aureos-a'; const x1 = x, y1 = isA ? y + rectH : y, x2 = x + rectW, y2 = isA ? y : y + rectH;
            line(x1, y1, x2, y2); const corners = isA ? [{cx:x, cy:y}, {cx:x+rectW, cy:y+rectH}] : [{cx:x+rectW, cy:y}, {cx:x, cy:y+rectH}];
            corners.forEach(c => { const dx = x2-x1, dy = y2-y1, t = ((c.cx-x1)*dx + (c.cy-y1)*dy) / (dx*dx + dy*dy); line(c.cx, c.cy, x1 + t*dx, y1 + t*dy); });
        } else if (mode === 'puntos-fuerza') { for(let i=1; i<3; i++) for(let j=1; j<3; j++) { ctx.beginPath(); ctx.arc(x + rectW*i/3, y + rectH*j/3, 8, 0, 7); ctx.stroke(); } }
    }

    function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

    document.getElementById('mainActionBtn').addEventListener('click', () => {
        document.documentElement.requestFullscreen().then(() => {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } })
            .then(s => {
                video.srcObject = s; video.onloadedmetadata = () => {
                    isRunning = true; document.getElementById('mainActionBtn').style.display = "none";
                    document.getElementById('top-ui').style.display = "flex"; document.getElementById('controls-area').style.display = "flex";
                    render(0);
                };
            });
        });
    });

    document.getElementById('btn-shutter').addEventListener('click', () => {
        isFrozen = !isFrozen; document.getElementById('btn-shutter').classList.toggle('is-frozen');
        if (isFrozen && !fileInput.files[0]) {
            freezeCanvas.width = video.videoWidth; freezeCanvas.height = video.videoHeight; fCtx.drawImage(video, 0, 0);
        }
    });

    document.getElementById('btn-grid').addEventListener('click', (e) => { gIdx = (gIdx + 1) % grids.length; e.target.textContent = gridLabels[gIdx]; });
    document.getElementById('btn-color').addEventListener('click', () => { cIdx = (cIdx + 1) % colors.length; document.getElementById('color-dot').style.background = colors[cIdx]; });
    document.getElementById('btn-reset').addEventListener('click', () => {
        const gh = (window.innerWidth * 0.9) * 1.618; borderY = Math.max(0.05, (window.innerHeight - gh) / (2 * window.innerHeight));
        fugaX = 0.5; fugaY = 0.5;
    });
</script>
</body>
</html>
