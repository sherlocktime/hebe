<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Analizar Composición utilizando la Cámara</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: white; font-family: sans-serif; overflow: hidden; height: 100dvh; }
        #container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; touch-action: none; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; z-index: 2; pointer-events: auto; }

        #top-ui {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top, 0px));
            left: 0; right: 0;
            z-index: 30;
            display: none;
            gap: 10px;
            padding: 0 15px;
            pointer-events: none;
            justify-content: center;
            align-items: center;
        }

        .ui-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            height: 44px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        #btn-grid { flex: 1; max-width: 180px; padding: 0 10px; }
        #btn-color { width: 44px; padding: 0; }
        #color-dot { width: 14px; height: 14px; border-radius: 50%; background: white; border: 1.5px solid rgba(255,255,255,0.4); }
        #btn-reset { width: 44px; font-size: 22px; }

        #mainActionBtn { position: absolute; z-index: 40; padding: 18px 40px; font-size: 16px; border-radius: 30px; border: none; background: white; color: black; font-weight: bold; }

        .controls-area {
            position: fixed;
            bottom: calc(30px + env(safe-area-inset-bottom, 0px));
            width: 100%;
            display: none;
            justify-content: center;
            pointer-events: none;
            z-index: 50;
        }

        #btn-shutter {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid white;
            background: transparent;
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            outline: none;
            padding: 0;
        }

        #btn-shutter-inner {
            width: 54px;
            height: 54px;
            background: white;
            border-radius: 50%;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #btn-shutter.is-frozen #btn-shutter-inner {
            background: #007AFF;
            transform: scale(0.85);
        }

        #btn-shutter:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <button id="mainActionBtn">COMENZAR</button>

    <div id="top-ui">
        <button id="btn-grid" class="ui-btn">Regla de Tercios</button>
        <button id="btn-color" class="ui-btn"><div id="color-dot"></div></button>
        <button id="btn-reset" class="ui-btn" title="Reset">&#8864;</button>
    </div>

    <div class="controls-area" id="controls-area">
        <button id="btn-shutter">
            <div id="btn-shutter-inner"></div>
        </button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const freezeCanvas = document.createElement('canvas');
    const fCtx = freezeCanvas.getContext('2d');

    const grids = ['tercios', 'golden', 'tri-aureos-a', 'tri-aureos-b', 'puntos-fuerza', 'cuadrado', 'fuga', 'fibonacci-a', 'fibonacci-b', 'simetria', 'diagonales'];
    const gridLabels = ['Regla de Tercios', 'Proporción Áurea', 'Triángulos Áureos A', 'Triángulos Áureos B', 'Puntos de Fuerza', 'Encuadre Cuadrado', '1 Punto de Fuga', 'Fibo Rects Der', 'Fibo Rects Izq', 'Simetría Central', 'Diagonales'];
    let gIdx = 0;

    const colors = ['#FFFFFF', '#FF3B30', '#4CD964', '#FFCC00', '#007AFF'];
    let cIdx = 0;

    let isRunning = false;
    let isFrozen = false;
    let marginX = 0.05;

    // Calculo inicial para Rectángulo Dorado
    const goldenRatio = 1.618;
    let borderY = (1 - ((1 - 2 * marginX) * (window.innerWidth / window.innerHeight) * goldenRatio)) / 2;
    if (borderY < 0.05) borderY = 0.1; // Seguridad por si la pantalla es muy alargada

    let isDragging = false;
    let dragMode = "none";
    let fugaX = 0.5;
    let fugaY = 0.5;

    let lastFrameTime = 0;
    const fpsLimit = 30;

    async function lockPortrait() {
        try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('portrait'); } catch (e) {}
    }

    function handleStart(e) {
        if (!isRunning) return;
        const rect = canvas.getBoundingClientRect();
        const touchY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        const H = window.innerHeight;

        const currentTop = H * borderY;
        const currentBottom = H * (1 - borderY);
        const handleSize = 50; // Área de sensibilidad de la manija

        // Solo arrastrar marco si se toca cerca de las manijas (arriba o abajo)
        if (Math.abs(touchY - currentTop) < handleSize || Math.abs(touchY - currentBottom) < handleSize) {
            isDragging = true;
            dragMode = "frame";
        } else if (grids[gIdx] === 'fuga') {
            // Si es modo fuga y no tocó manijas, chequear si toca el centro para mover punto de fuga
            isDragging = true;
            dragMode = "fuga";
        }

        if (isDragging) handleMove(e);
    }

    function handleMove(e) {
        if (!isDragging || !isRunning) return;
        const rect = canvas.getBoundingClientRect();
        const touchX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const touchY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        const W = window.innerWidth, H = window.innerHeight;
        const rectW = W * (1 - 2 * marginX);
        const rectH = H * (1 - 2 * borderY);
        const startX = W * marginX;
        const startY = H * borderY;

        if (dragMode === "frame") {
            let normalizedY = touchY / H;
            if (normalizedY > 0.5) normalizedY = 1 - normalizedY;
            borderY = Math.max(0.01, Math.min(0.48, normalizedY));
        } else if (dragMode === "fuga") {
            fugaX = (touchX - startX) / rectW;
            fugaY = (touchY - startY) / rectH;
        }
    }

    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', () => { isDragging = false; dragMode = "none"; });
    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', (e) => isDragging && handleMove(e));
    window.addEventListener('mouseup', () => { isDragging = false; dragMode = "none"; });

    function render(now) {
        if (!isRunning) return;
        if (now - lastFrameTime < (1000 / fpsLimit)) {
            requestAnimationFrame(render);
            return;
        }
        lastFrameTime = now;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const W = canvas.width, H = canvas.height;
        const rectW = W * (1 - 2 * marginX);
        const rectH = H * (1 - 2 * borderY);
        const x = W * marginX, y = H * borderY;

        ctx.clearRect(0, 0, W, H);

        if (isFrozen) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.fillRect(0, 0, W, H);
            ctx.save();
            ctx.beginPath(); ctx.rect(x, y, rectW, rectH); ctx.clip();
            const imgW = freezeCanvas.width, imgH = freezeCanvas.height;
            const imgRatio = imgW / imgH;
            const containerRatio = W / H;
            let sX, sY, sW, sH;
            if (imgRatio > containerRatio) {
                sH = imgH; sW = imgH * containerRatio; sX = (imgW - sW) / 2; sY = 0;
            } else {
                sW = imgW; sH = imgW / containerRatio; sX = 0; sY = (imgH - sH) / 2;
            }
            ctx.drawImage(freezeCanvas, sX, sY, sW, sH, 0, 0, W, H);
            ctx.restore();
        } else {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(x, y, rectW, rectH);
            ctx.globalCompositeOperation = 'source-over';
        }

        ctx.save();
        ctx.beginPath(); ctx.rect(x, y, rectW, rectH); ctx.clip();
        ctx.strokeStyle = colors[cIdx];
        ctx.fillStyle = colors[cIdx];
        ctx.lineWidth = 1.5;
        dibujarGrilla(grids[gIdx], x, y, rectW, rectH);
        ctx.restore();

        ctx.strokeStyle = colors[cIdx];
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x, y, rectW, rectH);

        // Manijas visuales
        ctx.fillStyle = colors[cIdx];
        ctx.globalAlpha = 0.6;
        ctx.fillRect(W/2 - 25, y - 2, 50, 4);
        ctx.fillRect(W/2 - 25, y + rectH - 2, 50, 4);
        ctx.globalAlpha = 1.0;

        requestAnimationFrame(render);
    }

    function dibujarGrilla(mode, x, y, rectW, rectH) {
        if (mode === 'fuga') {
            const fx = x + rectW * fugaX;
            const fy = y + rectH * fugaY;
            ctx.setLineDash([6, 4]);
            line(x-2000, fy, x+rectW+2000, fy);
            line(fx, y-2000, fx, y+rectH+2000);
            ctx.setLineDash([]);
            line(x, y, fx, fy);
            line(x + rectW, y, fx, fy);
            line(x, y + rectH, fx, fy);
            line(x + rectW, y + rectH, fx, fy);
            ctx.beginPath(); ctx.arc(fx, fy, 4, 0, 7); ctx.fill();
        } else if (mode === 'tercios') {
            for(let i=1; i<3; i++) {
                line(x + rectW*i/3, y, x + rectW*i/3, y + rectH);
                line(x, y + rectH*i/3, x + rectW, y + rectH*i/3);
            }
        } else if (mode.startsWith('tri-aureos')) {
            const isA = mode === 'tri-aureos-a';
            const x1 = x, y1 = isA ? y + rectH : y, x2 = x + rectW, y2 = isA ? y : y + rectH;
            line(x1, y1, x2, y2);
            const corners = isA ? [{cx:x, cy:y}, {cx:x+rectW, cy:y+rectH}] : [{cx:x+rectW, cy:y}, {cx:x, cy:y+rectH}];
            corners.forEach(c => {
                const dx = x2-x1, dy = y2-y1;
                const t = ((c.cx-x1)*dx + (c.cy-y1)*dy) / (dx*dx + dy*dy);
                line(c.cx, c.cy, x1 + t*dx, y1 + t*dy);
            });
        } else if (mode.startsWith('fibonacci')) {
            const isB = mode === 'fibonacci-b';
            let cX = x, cY = y, cW = rectW, cH = rectH;
            for (let i = 0; i < 7; i++) {
                let side = Math.min(cW, cH);
                const step = i % 4;
                if (step === 0) { // Abajo
                    ctx.strokeRect(cX, cY + cH - side, cW, side);
                    cH -= side;
                } else if (step === 1) { // Lado
                    if (!isB) { // Derecha
                        ctx.strokeRect(cX + cW - side, cY, side, cH);
                        cW -= side;
                    } else { // Izquierda
                        ctx.strokeRect(cX, cY, side, cH);
                        cX += side;
                        cW -= side;
                    }
                } else if (step === 2) { // Arriba
                    ctx.strokeRect(cX, cY, cW, side);
                    cY += side;
                    cH -= side;
                } else if (step === 3) { // Lado opuesto
                    if (!isB) { // Izquierda
                        ctx.strokeRect(cX, cY, side, cH);
                        cX += side;
                        cW -= side;
                    } else { // Derecha
                        ctx.strokeRect(cX + cW - side, cY, side, cH);
                        cW -= side;
                    }
                }
                if (cW < 4 || cH < 4) break;
            }
        } else if (mode === 'puntos-fuerza') {
            for(let i=1; i<3; i++) for(let j=1; j<3; j++) {
                ctx.beginPath(); ctx.arc(x + rectW*i/3, y + rectH*j/3, 8, 0, 7); ctx.stroke();
            }
        } else if (mode === 'cuadrado') {
            const s = Math.min(rectW, rectH);
            ctx.strokeRect(x + (rectW-s)/2, y + (rectH-s)/2, s, s);
        } else if (mode === 'simetria') {
            line(x + rectW/2, y, x + rectW/2, y + rectH);
            line(x, y + rectH/2, x + rectW, y + rectH/2);
        } else if (mode === 'golden') {
            const p = 0.618;
            line(x+rectW*p, y, x+rectW*p, y+rectH); line(x+rectW*(1-p), y, x+rectW*(1-p), y+rectH);
            line(x, y+rectH*p, x+rectW, y+rectH*p); line(x, y+rectH*(1-p), x+rectW, y+rectH*(1-p));
        } else if (mode === 'diagonales') {
            line(x, y, x+rectW, y+rectH); line(x+rectW, y, x, y+rectH);
        }
    }

    function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

    function startCamera() {
        document.documentElement.requestFullscreen().then(lockPortrait).catch(() => {});
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        })
        .then(s => {
            video.srcObject = s;
            video.onloadedmetadata = () => {
                isRunning = true;
                document.getElementById('mainActionBtn').style.display = "none";
                document.getElementById('top-ui').style.display = "flex";
                document.getElementById('controls-area').style.display = "flex";
                render(0);
            };
        });
    }

    document.getElementById('mainActionBtn').addEventListener('click', startCamera);

    const shutter = document.getElementById('btn-shutter');
    shutter.addEventListener('click', () => {
        isFrozen = !isFrozen;
        shutter.classList.toggle('is-frozen');
        if (isFrozen) {
            freezeCanvas.width = video.videoWidth;
            freezeCanvas.height = video.videoHeight;
            fCtx.drawImage(video, 0, 0);
        }
    });

    document.getElementById('btn-grid').addEventListener('click', (e) => {
        gIdx = (gIdx + 1) % grids.length;
        e.target.textContent = gridLabels[gIdx];
    });

    document.getElementById('btn-color').addEventListener('click', () => {
        cIdx = (cIdx + 1) % colors.length;
        document.getElementById('color-dot').style.background = colors[cIdx];
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
        const W = window.innerWidth;
        const H = window.innerHeight;
        // Reset a Rectángulo Dorado
        borderY = (1 - ((1 - 2 * marginX) * (W / H) * goldenRatio)) / 2;
        if (borderY < 0.05) borderY = 0.1;
        fugaX = 0.5;
        fugaY = 0.5;
    });

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) isRunning = false;
        else if (video.srcObject) { isRunning = true; render(0); }
    });
</script>
</body>
</html>
