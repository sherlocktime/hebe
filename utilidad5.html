<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Estudio de Composición</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            height: 100dvh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            z-index: 2;
        }

        /* Pantalla Inicial */
        #splash-screen {
            position: absolute;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 20px;
            background: rgba(0,0,0,0.8);
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .main-btn {
            width: 260px;
            padding: 10px;
            font-size: 14px;
            border-radius: 0x;
            border: 1.5px solid rgba(255,255,255,0.2);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-local { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-museum { background: #FFCC00; color: #000; border: none; }
        .btn-photo { background: #FFCC00; color: #000; border: none; }

        /* UI de Control */
        .controls-area {
            position: fixed;
            bottom: calc(30px + env(safe-area-inset-bottom, 0px));
            width: 100%;
            display: none;
            gap: 0px;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 30;
            justify-content: center;
            pointer-events: none;
        }

        .ui-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 0px;
            height: 44px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            -webkit-tap-highlight-color: transparent;
        }

        #btn-grid { flex: 1; max-width: 180px; position: relative; }
        #btn-transform { width: 65px; }
        #btn-color { width: 44px; }
        #color-dot { width: 14px; height: 14px; border-radius: 50%; background: white; border: 1.5px solid rgba(255, 255, 255, 0.4); }
        #btn-reset { width: 44px; font-size: 22px; }

        #top-ui {
            position: absolute;
            top: calc(10px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            z-index: 50;
            display: none;
            justify-content: center;
            pointer-events: none;
        }

        #btn-change {
            padding: 0 20px;
            font-size: 11px;
            border-radius: 0px;
            pointer-events: auto;
        }

        /* Pop-up Menú Grillas */
        #grid-menu {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            z-index: 200;
            width: 200px;
            max-height: 500px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .grid-menu-item {
            padding: 12px;
            font-size: 12px;
            text-align: left;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            color: #ccc;
        }

        .grid-menu-item:hover, .grid-menu-item:active {
            background: rgba(255, 255, 0, 0.2);
            color: #fff;
        }

        .grid-menu-item.active {
            color: #FFCC00;
            font-weight: bold;
        }

        .loading { opacity: 0.5; pointer-events: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.7; } 100% { opacity: 0.3; } }
    </style>
</head>

<body>

    <div id="container">
        <canvas id="canvas"></canvas>

        <div id="splash-screen">
            <h2 style="margin-bottom: 20px; font-weight: 300;">ESTUDIO DE COMPOSICIÓN</h2>
            <button class="main-btn btn-local" id="action-local">Cargar de mi Galería</button>
            <button class="main-btn btn-photo" id="action-photo">Fotografía Aleatoria</button>
            <button class="main-btn btn-museum" id="action-museum">Art Institute Chicago</button>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
        </div>

        <div id="top-ui">
            <button id="btn-change" class="ui-btn">CAMBIAR ORIGEN</button>
        </div>

        <div class="controls-area" id="controls-area">
            <button id="btn-reset" class="ui-btn">&#8864;</button>
            
            <button id="btn-grid" class="ui-btn">
                Regla de Tercios
                <div id="grid-menu"></div>
            </button>
            
            <button id="btn-transform" class="ui-btn">MODO</button>
            <button id="btn-color" class="ui-btn"><div id="color-dot"></div></button>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN BASE ---
        const fps = 30;
        const fpsInterval = 1000 / fps;
        let then = performance.now();

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const fileInput = document.getElementById('file-input');
        const splash = document.getElementById('splash-screen');
        const topUI = document.getElementById('top-ui');
        const controls = document.getElementById('controls-area');
        const btnGrid = document.getElementById('btn-grid');
        const btnTransform = document.getElementById('btn-transform');
        const btnChange = document.getElementById('btn-change');

        // Agregamos 'focus' al final de la lista
        const grids = ['tercios', 'golden', 'tri-aureos', 'fibonacci', 'diagonales', 'fuga', 'horizonte', 'comp-L', 'cuadrado', 'masas', 'focus'];
        const gridLabels = ['Regla de Tercios', 'Sección Áurea', 'Triángulos Áureos', 'Espiral Fibonacci', 'Diagonal', 'Punto de Fuga', 'Horizonte', 'Composición en L', 'Recorte Cuadrado', 'Balance', 'Enfoque'];
        
        let gIdx = 0, transformIdx = 0, cIdx = 0;
        // const colors = ['#FFFFFF', '#FF3B30', '#4CD964', '#FFCC00', '#007AFF'];
        const colors = ['#FFFFFF', '#FF0088', '#00CCFF', '#FFCC00', '#00FF00', '#000000'];

        let loadedImage = null, masasImage = null;
        let isRunning = false, isDragging = false, dragMode = "none";
        let imgX = 0, imgY = 0, imgScale = 1;
        let initialImgX = 0, initialImgY = 0, initialScale = 1, initialDist = 0, initialCenter = { x: 0, y: 0 };
        let startTouches = [];
        
        let horY = 0.5, horMode = "H", fugaX = 0.5, fugaY = 0.5, interX = 0.3, interY = 0.3;
        let mBlur = 5, mThr = 127, mInvert = false, isBypass = false;
        let pulseStartTime = 0;
        
        // Config para filtro Sobel / Focus Peaking
        let fThreshold = 40; 

        // --- CAJA NEGRA DE PROCESAMIENTO ---

        function processImages(img) {
            let w = img.width, h = img.height;
            let needsRotate = w > h; 
            
            function createVariant(maxDim) {
                let tw = img.width, th = img.height;
                let scale = Math.min(maxDim / (needsRotate ? th : tw), maxDim / (needsRotate ? tw : th));
                if (scale > 1) scale = 1;

                const tCanvas = document.createElement('canvas');
                tCanvas.width = needsRotate ? th * scale : tw * scale;
                tCanvas.height = needsRotate ? tw * scale : th * scale;

                const tCtx = tCanvas.getContext('2d');
                if (needsRotate) {
                    tCtx.translate(tCanvas.width / 2, tCanvas.height / 2);
                    tCtx.rotate(Math.PI / 2);
                    tCtx.drawImage(img, -tw * scale / 2, -th * scale / 2, tw * scale, th * scale);
                } else {
                    tCtx.drawImage(img, 0, 0, tw * scale, th * scale);
                }
                
                const newImg = new Image();
                newImg.src = tCanvas.toDataURL('image/jpeg', 0.8);
                return newImg;
            }

            loadedImage = createVariant(1200);
            masasImage = createVariant(600);

            loadedImage.onload = () => {
                centerImage();
                if (!isRunning) {
                    isRunning = true;
                    requestAnimationFrame(render);
                }
                splash.style.display = "none";
                topUI.style.display = "flex";
                controls.style.display = "flex";
                btnChange.classList.remove('loading');
            };
        }

        async function loadMuseumArt(retries = 3) {
            btnChange.classList.add('loading');
            try {
                const page = Math.floor(Math.random() * 100) + 1;
                const resp = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=painting&page=${page}&limit=20&fields=image_id`);

                if (!resp.ok) throw new Error("Error en respuesta de API");
                const data = await resp.json();
                const artworks = data.data.filter(a => a.image_id);
                if (artworks.length === 0) throw new Error("No hay imágenes en esta página");
                const art = artworks[Math.floor(Math.random() * artworks.length)];
                const tempImg = new Image();
                tempImg.crossOrigin = "anonymous";
                tempImg.onload = () => processImages(tempImg);
                tempImg.onerror = () => { if(retries > 0) loadMuseumArt(retries - 1); };
                tempImg.src = `https://www.artic.edu/iiif/2/${art.image_id}/full/800,/0/default.jpg`;

            } catch (e) { 
                if (retries > 0) {
                    console.log(`Reintentando carga... quedan ${retries} intentos`);
                    setTimeout(() => loadMuseumArt(retries - 1), 500);
                } else {
                    alert("El museo no responde, intenta con una foto.");
                    btnChange.classList.remove('loading');
                }
            }
        }

        async function loadRandomPhoto() {
            btnChange.classList.add('loading');
            const tempImg = new Image();
            tempImg.crossOrigin = "anonymous";
            const randomId = Math.floor(Math.random() * 1000);
            tempImg.src = `https://picsum.photos/1200/1600?sig=${randomId}`;
            
            tempImg.onload = () => processImages(tempImg);
            tempImg.onerror = () => {
                alert("Error al cargar fotografía");
                btnChange.classList.remove('loading');
            };
        }

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const tempImg = new Image();
                tempImg.onload = () => processImages(tempImg);
                tempImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        function centerImage() {
            const W = window.innerWidth, H = window.innerHeight;
            const ir = loadedImage.width / loadedImage.height;
            if (ir > W / H) { imgScale = W / loadedImage.width; } 
            else { imgScale = H / loadedImage.height; }
            imgX = (W - loadedImage.width * imgScale) / 2;
            imgY = (H - loadedImage.height * imgScale) / 2;
            fugaX = 0.5; fugaY = 0.5; transformIdx = 0;
        }

        // --- INTERACCIÓN ---

        function handleStart(e) {
            if (!isRunning) return;
            isDragging = true;
            startTouches = Array.from(e.touches || [e]);
            if (startTouches.length === 1) {
                const grid = grids[gIdx];
                if (grid === 'fuga') dragMode = "fuga";
                else if (grid === 'horizonte') dragMode = "horizonte";
                else if (grid === 'comp-L') dragMode = "comp-L";
                else if (grid === 'masas') dragMode = "masas";
                else if (grid === 'focus') dragMode = "focus";
                else { dragMode = "pan"; initialImgX = imgX; initialImgY = imgY; }
            } else if (startTouches.length === 2) {
                dragMode = "zoom";
                initialDist = Math.hypot(startTouches[0].clientX - startTouches[1].clientX, startTouches[0].clientY - startTouches[1].clientY);
                initialScale = imgScale; initialImgX = imgX; initialImgY = imgY;
                initialCenter = { x: (startTouches[0].clientX + startTouches[1].clientX) / 2, y: (startTouches[0].clientY + startTouches[1].clientY) / 2 };
            }
        }

        function handleMove(e) {
            if (!isDragging || !loadedImage) return;
            const cur = Array.from(e.touches || [e]);
            const rw = loadedImage.width * imgScale, rh = loadedImage.height * imgScale;

            if (cur.length === 1 && dragMode !== "zoom") {
                let nx = (cur[0].clientX - imgX) / rw;
                let ny = (cur[0].clientY - imgY) / rh;
                if (dragMode === "fuga") { fugaX = nx; fugaY = ny; }
                else if (dragMode === "horizonte") { if(horMode === "H") horY = Math.max(0,Math.min(1,ny)); else fugaX = nx; }
                else if (dragMode === "comp-L") { interX = nx; interY = ny; }
                else if (dragMode === "masas") {
                    let rawX = Math.max(0, Math.min(1, nx));
                    let rawY = Math.max(0, Math.min(1, ny));
                    let curveX = rawX * rawX * (3 - 2 * rawX);
                    let curveY = rawY * rawY * (3 - 2 * rawY);
                    mBlur = curveX * 40; 
                    mThr = 20 + (curveY * 235);
                }
                else if (dragMode === "focus") {
                    // Control vertical para el umbral de Sobel
                    let rawY = Math.max(0, Math.min(1, ny));
                    fThreshold = 5 + (rawY * 200);
                }
                else { 
                    imgX = initialImgX + (cur[0].clientX - startTouches[0].clientX); 
                    imgY = initialImgY + (cur[0].clientY - startTouches[0].clientY); 
                }
            } else if (cur.length === 2) {
                const newDist = Math.hypot(cur[0].clientX - cur[1].clientX, cur[0].clientY - cur[1].clientY);
                imgScale = Math.max(0.1, initialScale * (newDist / initialDist));
                const newCenter = { x: (cur[0].clientX + cur[1].clientX) / 2, y: (cur[0].clientY + cur[1].clientY) / 2 };
                imgX = initialImgX + (newCenter.x - initialCenter.x);
                imgY = initialImgY + (newCenter.y - initialCenter.y);
            }
        }

        // --- RENDER ---

        function render(time) {
            requestAnimationFrame(render);
            let now = performance.now();
            let elapsed = now - then;
            if (elapsed < fpsInterval) return;
            then = now - (elapsed % fpsInterval);

            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (loadedImage) {
                const rw = Math.round(loadedImage.width * imgScale);
                const rh = Math.round(loadedImage.height * imgScale);
                
                if (grids[gIdx] === 'masas' && !isBypass && masasImage) {
                    ctx.save();
                    ctx.filter = `grayscale(100%) blur(${mBlur}px)`;
                    ctx.drawImage(masasImage, imgX, imgY, rw, rh);
                    const imgData = ctx.getImageData(imgX, imgY, rw, rh);
                    const data = imgData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        let v = data[i] > mThr ? 255 : 0;
                        if (mInvert) v = 255 - v;
                        data[i] = data[i + 1] = data[i + 2] = v;
                    }
                    ctx.filter = 'none';
                    ctx.putImageData(imgData, imgX, imgY);
                    ctx.restore();
                } 
                else if (grids[gIdx] === 'focus' && !isBypass) {
                    // MODO FOCUS PEAKING (SOBEL)
                    ctx.save();
                    // Imagen base oscurecida
                    ctx.filter = 'brightness(0.3) grayscale(0.5)';
                    ctx.drawImage(loadedImage, imgX, imgY, rw, rh);
                    ctx.filter = 'none';

                    const imgData = ctx.getImageData(imgX, imgY, rw, rh);
                    const d = imgData.data;
                    const w = rw, h = rh;
                    const mask = new Uint8Array(w * h);

                    // Sobel simplificado usando el canal verde
                    for (let y = 1; y < h - 1; y++) {
                        for (let x = 1; x < w - 1; x++) {
                            const i = (y * w + x) * 4;
                            const s11 = d[((y-1)*w+(x-1))*4 + 1];
                            const s12 = d[((y-1)*w+x)*4 + 1];
                            const s13 = d[((y-1)*w+(x+1))*4 + 1];
                            const s21 = d[(y*w+(x-1))*4 + 1];
                            const s23 = d[(y*w+(x+1))*4 + 1];
                            const s31 = d[((y+1)*w+(x-1))*4 + 1];
                            const s32 = d[((y+1)*w+x)*4 + 1];
                            const s33 = d[((y+1)*w+(x+1))*4 + 1];

                            const gx = (s13 + 2*s23 + s33) - (s11 + 2*s21 + s31);
                            const gy = (s31 + 2*s32 + s33) - (s11 + 2*s12 + s13);

                            if ((Math.abs(gx) + Math.abs(gy)) > fThreshold) {
                                mask[y * w + x] = 1;
                            }
                        }
                    }

                    // Pintado de masa con color seleccionado
                    const p32 = new Uint32Array(d.buffer);
                    // Convertimos hex a formato ABGR para Uint32Array
                    const hex = colors[cIdx].replace('#', '');
                    const r = parseInt(hex.substring(0,2), 16);
                    const g = parseInt(hex.substring(2,4), 16);
                    const b = parseInt(hex.substring(4,6), 16);
                    const color32 = (0xFF << 24) | (b << 16) | (g << 8) | r;

                    for (let y = 1; y < h - 1; y++) {
                        for (let x = 1; x < w - 1; x++) {
                            const idx = y * w + x;
                            if (mask[idx] || mask[idx-1] || mask[idx+1] || mask[idx-w] || mask[idx+w]) {
                                p32[idx] = color32;
                            }
                        }
                    }
                    ctx.putImageData(imgData, imgX, imgY);
                    ctx.restore();
                }
                else {
                    ctx.drawImage(loadedImage, imgX, imgY, rw, rh);
                }

                // Contexto Grillas
                ctx.save();
                ctx.beginPath(); ctx.rect(imgX, imgY, rw, rh); ctx.clip();
                
                const cx = imgX + rw/2, cy = imgY + rh/2;
                ctx.save();
                if (grids[gIdx] !== 'tercios') {
                    if (transformIdx === 1) { ctx.translate(2*cx, 0); ctx.scale(-1, 1); }
                    else if (transformIdx === 2) { ctx.translate(2*cx, 2*cy); ctx.rotate(Math.PI); }
                    else if (transformIdx === 3) { ctx.translate(0, 2*cy); ctx.scale(1, -1); }
                }

                ctx.strokeStyle = colors[cIdx]; ctx.lineWidth = 1.5;
                drawGrid(grids[gIdx], imgX, imgY, rw, rh, time);
                ctx.restore();
                ctx.restore();
                
                ctx.strokeStyle = colors[cIdx]; ctx.lineWidth = 2; ctx.strokeRect(imgX, imgY, rw, rh);
            }
        }

        // GRILLAS
        function drawGrid(mode, x, y, w, h, time) {
            if (mode === 'focus') return; // El focus no dibuja líneas extra
            ctx.setLineDash([]); 
            ctx.lineWidth = 1.5;

            if (mode === 'tercios') {
                if (transformIdx % 2 === 0) {
                    for (let i = 1; i < 3; i++) {
                        line(x + w * i / 3, y, x + w * i / 3, y + h);
                        line(x, y + h * i / 3, x + w, y + h * i / 3);
                    }
                } else {
                    for (let i = 1; i < 3; i++) {
                        for (let j = 1; j < 3; j++) {
                            ctx.beginPath(); ctx.arc(x + w * i / 3, y + h * j / 3, 9, 0, 6.3); ctx.stroke();
                        }
                    }
                }
            } else if (mode === 'golden') {
                const p = 0.618; 
                if (transformIdx % 2 === 0) {
                    line(x + w * p, y, x + w * p, y + h); 
                    line(x + w * (1 - p), y, x + w * (1 - p), y + h);
                    line(x, y + h * p, x + w, y + h * p); 
                    line(x, y + h * (1 - p), x + w, y + h * (1 - p));
                } else {
                    const phis = [0.236, 0.382, 0.618, 0.764]; 
                    ctx.setLineDash([5, 5]);
                    phis.forEach(pos => {
                        line(x + w * pos, y, x + w * pos, y + h);
                        line(x, y + h * pos, x + w, y + h * pos);
                    });
                    ctx.setLineDash([]);
                }
            } else if (mode === 'tri-aureos') {
                line(x, y + h, x + w, y); 
                const dx = w, dy = -h;
                const t1 = ((-h) * dy) / (dx * dx + dy * dy); line(x, y, x + t1 * dx, y + h + t1 * dy);
                const t2 = ((w) * dx) / (dx * dx + dy * dy); line(x + w, y + h, x + t2 * dx, y + h + t2 * dy);
            } else if (mode === 'fibonacci') {
                let cX = x, cY = y, cW = w, cH = h;
                for (let i = 0; i < 7; i++) {
                    let s = Math.min(cW, cH);
                    if (i % 4 === 0) { ctx.strokeRect(cX, cY + cH - s, cW, s); cH -= s; }
                    else if (i % 4 === 1) { ctx.strokeRect(cX + cW - s, cY, s, cH); cW -= s; }
                    else if (i % 4 === 2) { ctx.strokeRect(cX, cY, cW, s); cY += s; cH -= s; }
                    else if (i % 4 === 3) { ctx.strokeRect(cX, cY, s, cH); cX += s; cW -= s; }
                }
            } else if (mode === 'diagonales') { 
                line(x, y, x + w, y + h); 
            } else if (mode === 'fuga') {
                const fx = x + w * fugaX, fy = y + h * fugaY;
                ctx.setLineDash([5, 5]); line(x, fy, x + w, fy); line(fx, y, fx, y + h);
                ctx.setLineDash([]); line(x, y, fx, fy); line(x + w, y, fx, fy); line(x, y + h, fx, fy); line(x + w, y + h, fx, fy);
                const elapsed = time - pulseStartTime;
                if (elapsed < 1000) {
                    const pulse = Math.abs(Math.sin(elapsed / 200));
                    ctx.beginPath(); ctx.arc(fx, fy, 5 + pulse * 10, 0, 7);
                    ctx.strokeStyle = colors[cIdx]; ctx.globalAlpha = 1 - pulse; ctx.stroke(); ctx.globalAlpha = 1;
                }
                ctx.fillStyle = colors[cIdx]; ctx.beginPath(); ctx.arc(fx, fy, 5, 0, 7); ctx.fill();
            } else if (mode === 'horizonte') {
                const numLineas = 10; ctx.setLineDash([]); ctx.globalAlpha = 0.8;
                if (horMode === "H") {
                    const hy = y + h * horY; ctx.lineWidth = 2.5; line(x, hy, x + w, hy);
                    for (let i = 1; i <= numLineas; i++) {
                        const offset = Math.pow(i / numLineas, 2.0);
                        const ySuelo = hy + (y + h - hy) * offset;
                        ctx.lineWidth = 1.5 * (1 - offset + 0.2); line(x, ySuelo, x + w, ySuelo);
                    }
                } else {
                    const vx = x + w * fugaX; ctx.lineWidth = 2.5; line(vx, y, vx, y + h);
                    for (let i = 1; i <= numLineas; i++) {
                        const offset = Math.pow(i / numLineas, 2.0);
                        const xPared = vx - (vx - x) * offset;
                        ctx.lineWidth = 1.5 * (1 - offset + 0.2); line(xPared, y, xPared, y + h);
                    }
                }
                ctx.globalAlpha = 1.0;
            } else if (mode === 'comp-L') {
                const ix = x + w * interX, iy = y + h * interY; 
                line(x, iy, x + w, iy); line(ix, y, ix, y + h);
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                const aTL = interX * interY, aTR = (1 - interX) * interY, aBL = interX * (1 - interY), aBR = (1 - interX) * (1 - interY);
                const maxA = Math.max(aTL, aTR, aBL, aBR);
                if (aTL !== maxA) ctx.fillRect(x, y, ix - x, iy - y);
                if (aTR !== maxA) ctx.fillRect(ix, y, (x + w) - ix, iy - y);
                if (aBL !== maxA) ctx.fillRect(x, iy, ix - x, (y + h) - iy);
                if (aBR !== maxA) ctx.fillRect(ix, iy, (x + w) - ix, (y + h) - iy);
                const elapsed = time - pulseStartTime;
                if (elapsed < 1000) {
                    const pulse = Math.abs(Math.sin(elapsed / 200));
                    ctx.beginPath(); ctx.arc(ix, iy, 7 + pulse * 10, 0, 7);
                    ctx.strokeStyle = colors[cIdx]; ctx.globalAlpha = 1 - pulse; ctx.stroke(); ctx.globalAlpha = 1;
                }
                ctx.fillStyle = colors[cIdx]; ctx.beginPath(); ctx.arc(ix, iy, 7, 0, 7); ctx.fill();
            } else if (mode === 'cuadrado') {
                const s = Math.min(w, h); const ox = (w - s) / 2, oy = (h - s) / 2;
                ctx.save(); ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                if (w > h) { ctx.fillRect(x, y, ox, h); ctx.fillRect(x + ox + s, y, ox, h); }
                else { ctx.fillRect(x, y, w, oy); ctx.fillRect(x, y + oy + s, w, oy); }
                ctx.restore(); ctx.strokeRect(x + ox, y + oy, s, s);
            }
        }

        function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

        // --- EVENTOS ---

        document.getElementById('action-local').onclick = () => fileInput.click();
        document.getElementById('action-museum').onclick = loadMuseumArt;
        document.getElementById('action-photo').onclick = loadRandomPhoto;
        
        btnChange.onclick = () => {
            splash.style.display = "flex";
            topUI.style.display = "none";
            controls.style.display = "none";
        };

        // --- LÓGICA DE MENÚ POP-UP GRIDS Y LONG PRESS ---
        const gridMenu = document.getElementById('grid-menu');
        let longPressTimer = null;
        let isLongPress = false;

        // Generar items dinámicamente en el menú
        function buildGridMenu() {
            gridMenu.innerHTML = '';
            gridLabels.forEach((label, index) => {
                const item = document.createElement('div');
                item.className = `grid-menu-item ${index === gIdx ? 'active' : ''}`;
                item.innerText = label;
                item.onclick = (e) => {
                    e.stopPropagation(); // Evitamos que dispare el onclick del botón padre
                    setGrid(index);
                    gridMenu.style.display = 'none';
                };
                gridMenu.appendChild(item);
            });
        }

        // Función centralizada para actualizar la grilla
        function setGrid(index) {
            gIdx = index;
            btnGrid.firstChild.textContent = gridLabels[gIdx] + " "; // Actualizar texto sin borrar el menú hijo
            transformIdx = 0; 
            if (['fuga', 'comp-L'].includes(grids[gIdx])) pulseStartTime = performance.now();
            const noTransform = ['cuadrado', 'fuga', 'comp-L', 'focus'].includes(grids[gIdx]);
            btnTransform.style.opacity = noTransform ? "0.5" : "1";
            btnTransform.style.pointerEvents = noTransform ? "none" : "auto";
            buildGridMenu(); // Refrescar clase active
        }

        // Inicializamos el menú interno
        buildGridMenu();

        // Manejo del click rápido (ciclar) o click largo (abrir menú)
        const startPress = (e) => {
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                buildGridMenu();
                gridMenu.style.display = 'block';
            }, 600); // 600ms para disparar el Long Press
        };

        const endPress = (e) => {
            clearTimeout(longPressTimer);
            if (!isLongPress) {
                // Click simple: Solo cicla si el menú no estaba ya visible
                if (gridMenu.style.display !== 'block') {
                    setGrid((gIdx + 1) % grids.length);
                }
            }
        };

        const cancelPress = () => {
            clearTimeout(longPressTimer);
        };

        // Asignación de eventos al botón de grilla
        btnGrid.addEventListener('mousedown', startPress);
        btnGrid.addEventListener('mouseup', endPress);
        btnGrid.addEventListener('mouseleave', cancelPress);

        btnGrid.addEventListener('touchstart', startPress, { passive: true });
        btnGrid.addEventListener('touchend', endPress);
        btnGrid.addEventListener('touchcancel', cancelPress);

        // Cerrar menú si haces click en cualquier otro lado
        document.addEventListener('click', (e) => {
            if (!btnGrid.contains(e.target)) {
                gridMenu.style.display = 'none';
            }
        });

        // Modificamos el click nativo para evitar interferencias
        btnGrid.onclick = (e) => {
            e.stopPropagation();
        };

        btnTransform.onclick = () => {
            if (grids[gIdx] === 'masas') mInvert = !mInvert;
            else if (grids[gIdx] === 'horizonte') horMode = (horMode === "H") ? "V" : "H";
            else if (['cuadrado', 'fuga', 'comp-L', 'focus'].includes(grids[gIdx])) { transformIdx = 0; }
            else transformIdx = (transformIdx + 1) % 4;
        };

        document.getElementById('btn-color').onclick = () => {
            cIdx = (cIdx + 1) % colors.length;
            document.getElementById('color-dot').style.backgroundColor = colors[cIdx];
        };

        const btnReset = document.getElementById('btn-reset');
        btnReset.onmousedown = btnReset.ontouchstart = (e) => { isBypass = true; if(e.cancelable) e.preventDefault(); };
        btnReset.onmouseup = btnReset.ontouchend = () => { isBypass = false; centerImage(); };

        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', () => isDragging = false);
        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', () => isDragging = false);

    </script>
</body>
</html>
