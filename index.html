<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Estudio de Composición</title>
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        color: white;
        font-family: sans-serif;
        overflow: hidden;
        height: 100dvh;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      #container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        position: absolute;
        z-index: 2;
      }

      /* Pantalla Inicial */
      #splash-screen {
        position: absolute;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.8);
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(10px);
      }

      .main-btn {
        width: 260px;
        padding: 10px;
        font-size: 14px;
        border-radius: 0x;
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn-local {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .btn-museum {
        background: #ffcc00;
        color: #000;
        border: none;
      }

      .btn-photo {
        background: #ffcc00;
        color: #000;
        border: none;
      }

      #loading-msg {
        position: absolute;
        bottom: 18%;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        display: none;
        z-index: 150;
        animation: pulse 1.2s infinite;
      }

      /* UI de Control */
      .controls-area {
        position: fixed;
        bottom: calc(30px + env(safe-area-inset-bottom, 0px));
        width: 100%;
        display: none;
        gap: 0px;
        padding: 0 15px;
        box-sizing: border-box;
        z-index: 30;
        justify-content: center;
        pointer-events: none;
      }

      .ui-btn {
        pointer-events: auto;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        border-radius: 0px;
        height: 44px;
        font-size: 11px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
        backdrop-filter: blur(5px);
        -webkit-tap-highlight-color: transparent;
      }

      #btn-grid {
        flex: 1;
        max-width: 180px;
        position: relative;
      }

      #btn-transform {
        width: 65px;
      }

      #btn-color {
        width: 44px;
      }

      #color-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: white;
        border: 1.5px solid rgba(255, 255, 255, 0.4);
      }

      #btn-reset {
        width: 65px;
      }

      #top-ui {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top, 0px));
        left: 0;
        right: 0;
        z-index: 50;
        display: none;
        justify-content: center;
        pointer-events: none;
      }

      #btn-change {
        padding: 0 20px;
        font-size: 11px;
        border-radius: 0px;
        pointer-events: auto;
      }

      /* Pop-up Menú Grillas */
      #grid-menu {
        display: none;
        position: absolute;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.9);
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(10px);
        z-index: 200;
        width: 200px;
        max-height: 500px;
        overflow-y: auto;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }

      .grid-menu-item {
        padding: 12px;
        font-size: 12px;
        text-align: left;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        cursor: pointer;
        color: #ccc;
      }

      .grid-menu-item:hover,
      .grid-menu-item:active {
        background: rgba(255, 255, 0, 0.2);
        color: #fff;
      }

      .grid-menu-item.active {
        color: #ffcc00;
        font-weight: bold;
      }

      .loading {
        opacity: 0.5;
        pointer-events: none;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 0.3;
        }

        50% {
          opacity: 0.7;
        }

        100% {
          opacity: 0.3;
        }
      }
    </style>
  </head>

  <body>
    <div id="container">
      <canvas id="canvas"></canvas>

      <div id="splash-screen">
        <h2 style="margin-bottom: 20px; font-weight: 300">
          ESTUDIO DE COMPOSICIÓN
        </h2>
        <button class="main-btn btn-local" id="action-local">
          Cargar de mi Galería
        </button>
        <button class="main-btn btn-photo" id="action-photo">
          Fotografía Aleatoria
        </button>
        <button class="main-btn btn-museum" id="action-museum">
          Art Institute Chicago
        </button>
        <input
          type="file"
          id="file-input"
          accept="image/*"
          style="display: none"
        />
        <div id="loading-msg">Cargando...</div>
      </div>

      <div id="top-ui">
        <button id="btn-change" class="ui-btn">CAMBIAR ORIGEN</button>
      </div>

      <div class="controls-area" id="controls-area">
        <button id="btn-reset" class="ui-btn">RESET</button>

        <button id="btn-grid" class="ui-btn">
          Regla de Tercios
          <div id="grid-menu"></div>
        </button>

        <button id="btn-transform" class="ui-btn">ALT</button>
        <button id="btn-color" class="ui-btn">
          <div id="color-dot"></div>
        </button>
      </div>
    </div>

    <script>
      // --- FUNCIONES DE PANTALLA Y ORIENTACIÓN ---
      function lockPortrait() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("portrait").catch(() => {});
        }
      }

      function toggleFullScreen() {
        if (!document.fullscreenElement) {
          document.documentElement
            .requestFullscreen()
            .then(() => lockPortrait())
            .catch(() => {});
        } else {
          lockPortrait();
        }
      }

      // --- CONFIGURACIÓN BASE ---
      const fps = 30;
      const fpsInterval = 1000 / fps;
      let then = performance.now();

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const fileInput = document.getElementById("file-input");
      const splash = document.getElementById("splash-screen");
      const loadingMsg = document.getElementById("loading-msg");
      const topUI = document.getElementById("top-ui");
      const controls = document.getElementById("controls-area");
      const btnGrid = document.getElementById("btn-grid");
      const btnTransform = document.getElementById("btn-transform");
      const btnChange = document.getElementById("btn-change");

      const grids = [
        "tercios",
        "golden",
        "diagonales",
        "tri-aureos",
        "espiral",
        "fuga",
        "horizonte",
        "reframe",
        "masas",
        "focus",
        "paleta",
      ];
      const gridLabels = [
        "Regla de Tercios",
        "Sección Áurea",
        "Diagonales",
        "Triángulos Áureos",
        "Espiral Fibonacci",
        "Punto de Fuga",
        "Horizonte",
        "Encuadre",
        "Masas",
        "Enfoque",
        "Paleta",
      ];

      let gIdx = 0,
        transformIdx = 0,
        cIdx = 0;
      const colors = [
        "#FFFFFF",
        "#FF0088",
        "#00CCFF",
        "#FFCC00",
        "#00FF00",
        "#000000",
      ];
      const color_masas = [
        "#FFFFFF",
        "#FF0088",
        "#00CCFF",
        "#FFCC00",
        "#00FF00",
        "#888888",
      ];

      let loadedImage = null,
        masasImage = null;
      let isRunning = false,
        isDragging = false,
        dragMode = "none";
      let imgX = 0,
        imgY = 0,
        imgScale = 1;
      let initialImgX = 0,
        initialImgY = 0,
        initialScale = 1,
        initialDist = 0,
        initialCenter = { x: 0, y: 0 };
      let startTouches = [];

      let horY = 0.5,
        horMode = "H",
        fugaX = 0.5,
        fugaY = 0.5;
      let frameX1 = 0.2;
      frameY1 = 0.2;
      frameX2 = 0.8;
      frameY2 = 0.8;
      let activeHandle = null;

      let mBlur = 5,
        mThr = 127,
        mInvert = false,
        isBypass = false;
      let pulseStartTime = 0;
      let fThreshold = 40;
      let paletteColors = [];
      let paletteDirty = true;

      function setLoading(state, text = "Cargando...") {
        loadingMsg.innerText = text;
        loadingMsg.style.display = state ? "block" : "none";

        document.querySelectorAll(".main-btn").forEach((btn) => {
          btn.disabled = state;
          btn.classList.toggle("loading", state);
        });
      }

      // --- CAJA NEGRA DE PROCESAMIENTO ---

      function processImages(img) {
        let w = img.width,
          h = img.height;
        const isMobile = window.matchMedia("(pointer: coarse)").matches;
        let needsRotate = isMobile && w > h;

        function createVariant(maxDim) {
          let tw = img.width,
            th = img.height;
          let scale = Math.min(
            maxDim / (needsRotate ? th : tw),
            maxDim / (needsRotate ? tw : th),
          );
          if (scale > 1) scale = 1;

          const tCanvas = document.createElement("canvas");
          tCanvas.width = needsRotate ? th * scale : tw * scale;
          tCanvas.height = needsRotate ? tw * scale : th * scale;

          const tCtx = tCanvas.getContext("2d");
          if (needsRotate) {
            tCtx.translate(tCanvas.width / 2, tCanvas.height / 2);
            tCtx.rotate(Math.PI / 2);
            tCtx.drawImage(
              img,
              (-tw * scale) / 2,
              (-th * scale) / 2,
              tw * scale,
              th * scale,
            );
          } else {
            tCtx.drawImage(img, 0, 0, tw * scale, th * scale);
          }

          const newImg = new Image();
          newImg.src = tCanvas.toDataURL("image/jpeg", 0.8);
          return newImg;
        }

        loadedImage = createVariant(1200);
        masasImage = createVariant(600);

        loadedImage.onload = () => {
          paletteDirty = true;
          centerImage();
          if (!isRunning) {
            isRunning = true;
            requestAnimationFrame(render);
          }
          splash.style.display = "none";
          topUI.style.display = "flex";
          controls.style.display = "flex";
          setLoading(false);
        };
      }

      async function loadMuseumArt(retries = 3) {
        toggleFullScreen(); // Llamada al iniciar carga
        setLoading(true, "Buscando imagen...");
        try {
          const page = Math.floor(Math.random() * 100) + 1;
          const resp = await fetch(
            `https://api.artic.edu/api/v1/artworks/search?q=painting&page=${page}&limit=20&fields=image_id`,
          );

          if (!resp.ok) throw new Error("Error en respuesta de API");
          const data = await resp.json();
          const artworks = data.data.filter((a) => a.image_id);
          if (artworks.length === 0)
            throw new Error("No hay imágenes en esta página");
          const art = artworks[Math.floor(Math.random() * artworks.length)];
          const tempImg = new Image();
          tempImg.crossOrigin = "anonymous";
          tempImg.onload = () => processImages(tempImg);
          tempImg.onerror = () => {
            if (retries > 0) loadMuseumArt(retries - 1);
          };
          tempImg.src = `https://www.artic.edu/iiif/2/${art.image_id}/full/800,/0/default.jpg`;
        } catch (e) {
          if (retries > 0) {
            console.log(`Reintentando carga... quedan ${retries} intentos`);
            setTimeout(() => loadMuseumArt(retries - 1), 500);
          } else {
            alert("El museo no responde, intenta con una foto.");
            setLoading(false);
          }
        }
      }

      async function loadRandomPhoto() {
        toggleFullScreen(); // Llamada al iniciar carga
        setLoading(true, "Buscando imagen...");
        const tempImg = new Image();
        tempImg.crossOrigin = "anonymous";
        const randomId = Math.floor(Math.random() * 1000);
        tempImg.src = `https://picsum.photos/1200/1600?sig=${randomId}`;

        tempImg.onload = () => processImages(tempImg);
        tempImg.onerror = () => {
          alert("Error al cargar fotografía");
          setLoading(false);
        };
      }

      fileInput.onchange = (e) => {
        toggleFullScreen(); // Llamada al seleccionar archivo
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const tempImg = new Image();
          tempImg.onload = () => processImages(tempImg);
          tempImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      function centerImage() {
        const W = window.innerWidth,
          H = window.innerHeight;
        const ir = loadedImage.width / loadedImage.height;
        if (ir > W / H) {
          imgScale = W / loadedImage.width;
        } else {
          imgScale = H / loadedImage.height;
        }
        imgX = (W - loadedImage.width * imgScale) / 2;
        imgY = (H - loadedImage.height * imgScale) / 2;
        fugaX = 0.5;
        fugaY = 0.5;
        transformIdx = 0;
        initFrameCompL();
      }

      function initFrameCompL() {
        const rw = loadedImage.width;
        const rh = loadedImage.height;
        const side = Math.min(rw, rh) * 0.9;
        frameX1 = (rw - side) / 2 / rw;
        frameY1 = (rh - side) / 2 / rh;
        frameX2 = (rw + side) / 2 / rw;
        frameY2 = (rh + side) / 2 / rh;
      }

      // --- FUNCIONES PALETAS de COLOR ---

      function generatePalette() {
        if (!masasImage) return;
        const tempCanvas = document.createElement("canvas");
        const tctx = tempCanvas.getContext("2d", {
          willReadFrequently: true,
        });
        tempCanvas.width = masasImage.width;
        tempCanvas.height = masasImage.height;
        tctx.drawImage(masasImage, 0, 0);
        const data = tctx.getImageData(
          0,
          0,
          tempCanvas.width,
          tempCanvas.height,
        ).data;
        const pixels = [];
        // sampleo reducido
        for (let i = 0; i < data.length; i += 16) {
          pixels.push([data[i], data[i + 1], data[i + 2]]);
        }
        const k = autoK(pixels);
        let clusters = kmeans(pixels, k, 8);
        clusters = filterSimilar(clusters, 38);
        clusters = clusters.slice(0, 8);
        paletteColors = clusters;
        paletteDirty = false;
      }

      function getBrightness(rgb) {
        return 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
      }

      function kmeans(pixels, k, iterations) {
        let centroids = Array.from(
          { length: k },
          () => pixels[Math.floor(Math.random() * pixels.length)],
        );
        let clusters = [];
        for (let i = 0; i < iterations; i++) {
          clusters = Array.from({ length: k }, () => []);
          for (const p of pixels) {
            let bestIdx = 0;
            let minDist = Infinity;
            for (let c = 0; c < k; c++) {
              const d = dist(p, centroids[c]);
              if (d < minDist) {
                minDist = d;
                bestIdx = c;
              }
            }
            clusters[bestIdx].push(p);
          }
          centroids = centroids.map((_, idx) => {
            if (clusters[idx].length === 0) {
              return centroids[idx];
            }
            let r = 0;
            let g = 0;
            let b = 0;
            for (const p of clusters[idx]) {
              r += p[0];
              g += p[1];
              b += p[2];
            }
            const n = clusters[idx].length;
            return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
          });
        }
        return centroids
          .map((c, idx) => ({
            color: c,
            size: clusters[idx].length,
            brightness: getBrightness(c),
          }))
          .sort((a, b) => b.brightness - a.brightness);
      }

      function filterSimilar(colors, threshold) {
        const result = [];
        for (const c of colors) {
          const isSimilar = result.some(
            (existing) => dist(c.color, existing.color) < threshold,
          );
          if (!isSimilar) {
            result.push(c);
          }
        }
        return result;
      }

      function dist(a, b) {
        return Math.sqrt(
          Math.pow(a[0] - b[0], 2) +
            Math.pow(a[1] - b[1], 2) +
            Math.pow(a[2] - b[2], 2),
        );
      }

      function estimateColorComplexity(pixels) {
        const map = new Map();
        for (const [r, g, b] of pixels) {
          const key = `${Math.floor(r / 32)}-${Math.floor(g / 32)}-${Math.floor(b / 32)}`;
          map.set(key, 1);
        }
        return map.size;
      }

      function autoK(pixels) {
        const complexity = estimateColorComplexity(pixels);
        let k = Math.round(complexity / 10);
        console.log(k);
        return Math.max(3, Math.min(k, 10));
      }

      // --- INTERACCIÓN ---

      function handleStart(e) {
        if (!isRunning) return;
        isDragging = true;
        startTouches = Array.from(e.touches || [e]);
        if (startTouches.length === 1) {
          const grid = grids[gIdx];
          if (grid === "fuga") dragMode = "fuga";
          else if (grid === "horizonte") dragMode = "horizonte";
          else if (grid === "reframe") {
            dragMode = "reframe";
            const rw = loadedImage.width * imgScale;
            const rh = loadedImage.height * imgScale;
            const px = (startTouches[0].clientX - imgX) / rw;
            const py = (startTouches[0].clientY - imgY) / rh;
            const d1 = Math.hypot(px - frameX1, py - frameY1);
            const d2 = Math.hypot(px - frameX2, py - frameY2);
            activeHandle = d1 < d2 ? 1 : 2;
          } else if (grid === "masas") dragMode = "masas";
          else if (grid === "focus") dragMode = "focus";
          else {
            dragMode = "pan";
            initialImgX = imgX;
            initialImgY = imgY;
          }
        } else if (startTouches.length === 2) {
          dragMode = "zoom";
          initialDist = Math.hypot(
            startTouches[0].clientX - startTouches[1].clientX,
            startTouches[0].clientY - startTouches[1].clientY,
          );
          initialScale = imgScale;
          initialImgX = imgX;
          initialImgY = imgY;
          initialCenter = {
            x: (startTouches[0].clientX + startTouches[1].clientX) / 2,
            y: (startTouches[0].clientY + startTouches[1].clientY) / 2,
          };
        }
      }

      function handleMove(e) {
        if (!isDragging || !loadedImage) return;
        const cur = Array.from(e.touches || [e]);
        const rw = loadedImage.width * imgScale,
          rh = loadedImage.height * imgScale;

        if (cur.length === 1 && dragMode !== "zoom") {
          let nx = (cur[0].clientX - imgX) / rw;
          let ny = (cur[0].clientY - imgY) / rh;
          if (dragMode === "fuga") {
            fugaX = nx;
            fugaY = ny;
          } else if (dragMode === "horizonte") {
            if (horMode === "H") horY = Math.max(0, Math.min(1, ny));
            else fugaX = nx;
          } else if (dragMode === "reframe") {
            nx = Math.max(0, Math.min(1, nx));
            ny = Math.max(0, Math.min(1, ny));
            if (activeHandle === 1) {
              frameX1 = Math.min(nx, frameX2 - 0.05);
              frameY1 = Math.min(ny, frameY2 - 0.05);
            } else {
              frameX2 = Math.max(nx, frameX1 + 0.05);
              frameY2 = Math.max(ny, frameY1 + 0.05);
            }
          } else if (dragMode === "masas") {
            let rawX = Math.max(0, Math.min(1, nx));
            let rawY = Math.max(0, Math.min(1, ny));
            let curveX = rawX * rawX * (3 - 2 * rawX);
            let curveY = rawY * rawY * (3 - 2 * rawY);
            mBlur = curveY * 40;
            mThr = curveX * 235;
          } else if (dragMode === "focus") {
            let rawY = Math.max(0, Math.min(1, ny));
            fThreshold = 5 + rawY * 200;
          } else {
            imgX = initialImgX + (cur[0].clientX - startTouches[0].clientX);
            imgY = initialImgY + (cur[0].clientY - startTouches[0].clientY);
          }
        } else if (cur.length === 2) {
          const newDist = Math.hypot(
            cur[0].clientX - cur[1].clientX,
            cur[0].clientY - cur[1].clientY,
          );
          imgScale = Math.max(0.1, initialScale * (newDist / initialDist));
          const newCenter = {
            x: (cur[0].clientX + cur[1].clientX) / 2,
            y: (cur[0].clientY + cur[1].clientY) / 2,
          };
          imgX = initialImgX + (newCenter.x - initialCenter.x);
          imgY = initialImgY + (newCenter.y - initialCenter.y);
        }
      }

      // --- RENDER ---

      function render(time) {
        requestAnimationFrame(render);
        let now = performance.now();
        let elapsed = now - then;
        if (elapsed < fpsInterval) return;
        then = now - (elapsed % fpsInterval);

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (loadedImage) {
          const rw = Math.round(loadedImage.width * imgScale);
          const rh = Math.round(loadedImage.height * imgScale);

          // Imagen base
          ctx.drawImage(loadedImage, imgX, imgY, rw, rh);

          // ===== MASAS =====

          if (grids[gIdx] === "masas" && !isBypass && masasImage) {
            ctx.save();
            ctx.filter = `grayscale(100%) blur(${mBlur}px)`;
            ctx.drawImage(masasImage, imgX, imgY, rw, rh);

            const imgData = ctx.getImageData(imgX, imgY, rw, rh);
            const data = imgData.data;
            const hex = color_masas[cIdx].replace("#", "");
            const cr = parseInt(hex.substring(0, 2), 16);
            const cg = parseInt(hex.substring(2, 4), 16);
            const cb = parseInt(hex.substring(4, 6), 16);

            for (let i = 0; i < data.length; i += 4) {
              let v = data[i] > mThr ? 255 : 0;
              if (mInvert) v = 255 - v;
              if (v === 255) {
                data[i] = cr;
                data[i + 1] = cg;
                data[i + 2] = cb;
              } else {
                data[i] = 0;
                data[i + 1] = 0;
                data[i + 2] = 0;
              }
            }
            ctx.filter = "none";
            ctx.putImageData(imgData, imgX, imgY);
            ctx.restore();
          }

          // ===== FOCUS =====

          if (grids[gIdx] === "focus" && !isBypass) {
            ctx.save();
            ctx.filter = "grayscale(0.25) brightness(0.25)";
            ctx.drawImage(loadedImage, imgX, imgY, rw, rh);
            ctx.filter = "none";

            const imgData = ctx.getImageData(imgX, imgY, rw, rh);
            const d = imgData.data;
            const w = rw,
              h = rh;
            const mask = new Uint8Array(w * h);

            for (let y = 1; y < h - 1; y++) {
              for (let x = 1; x < w - 1; x++) {
                const i = (y * w + x) * 4;
                const s11 = d[((y - 1) * w + (x - 1)) * 4];
                const s12 = d[((y - 1) * w + x) * 4];
                const s13 = d[((y - 1) * w + (x + 1)) * 4];
                const s21 = d[(y * w + (x - 1)) * 4];
                const s23 = d[(y * w + (x + 1)) * 4];
                const s31 = d[((y + 1) * w + (x - 1)) * 4];
                const s32 = d[((y + 1) * w + x) * 4];
                const s33 = d[((y + 1) * w + (x + 1)) * 4];
                const gx = s13 + 2 * s23 + s33 - (s11 + 2 * s21 + s31);
                const gy = s31 + 2 * s32 + s33 - (s11 + 2 * s12 + s13);
                if (Math.abs(gx) + Math.abs(gy) > fThreshold) {
                  mask[y * w + x] = 1;
                }
              }
            }
            const p32 = new Uint32Array(d.buffer);
            const hex = colors[cIdx].replace("#", "");
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            const color32 = (0xff << 24) | (b << 16) | (g << 8) | r;
            for (let y = 1; y < h - 1; y++) {
              for (let x = 1; x < w - 1; x++) {
                const idx = y * w + x;
                if (
                  mask[idx] ||
                  mask[idx - 1] ||
                  mask[idx + 1] ||
                  mask[idx - w] ||
                  mask[idx + w]
                ) {
                  p32[idx] = color32;
                }
              }
            }
            ctx.putImageData(imgData, imgX, imgY);
            ctx.restore();
          }

          // ===== PALETA =====

          if (grids[gIdx] === "paleta" && !isBypass) {
            if (paletteDirty || paletteColors.length === 0) {
              generatePalette();
            }

            ctx.save();
            ctx.filter = "brightness(0.35)";
            ctx.drawImage(loadedImage, imgX, imgY, rw, rh);
            ctx.restore();
            const bandW = rw / paletteColors.length;
            let offset = imgX;

            for (const cluster of paletteColors) {
              const [r, g, b] = cluster.color;
              ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
              ctx.fillRect(offset, imgY, bandW + 1, rh);
              offset += bandW;
            }
          }

          // Contexto Grillas
          ctx.save();
          ctx.beginPath();
          ctx.rect(imgX, imgY, rw, rh);
          ctx.clip();

          const cx = imgX + rw / 2,
            cy = imgY + rh / 2;
          ctx.save();
          if (grids[gIdx] !== "tercios" && grids[gIdx] !== "paleta") {
            if (transformIdx === 1) {
              ctx.translate(2 * cx, 0);
              ctx.scale(-1, 1);
            } else if (transformIdx === 2) {
              ctx.translate(2 * cx, 2 * cy);
              ctx.rotate(Math.PI);
            } else if (transformIdx === 3) {
              ctx.translate(0, 2 * cy);
              ctx.scale(1, -1);
            }
          }

          ctx.strokeStyle = colors[cIdx];
          ctx.lineWidth = 1.5;
          drawGrid(grids[gIdx], imgX, imgY, rw, rh, time);
          ctx.restore();

          ctx.strokeStyle = colors[cIdx];
          ctx.lineWidth = 2;
          ctx.strokeRect(imgX, imgY, rw, rh);
        }
      }

      // --- GRILLAS ---

      function drawGrid(mode, x, y, w, h, time) {
        if (mode === "focus") return;
        ctx.setLineDash([]);
        ctx.lineWidth = 1.5;

        if (mode === "tercios") {
          if (transformIdx % 2 === 0) {
            for (let i = 1; i < 3; i++) {
              line(x + (w * i) / 3, y, x + (w * i) / 3, y + h);
              line(x, y + (h * i) / 3, x + w, y + (h * i) / 3);
            }
          } else {
            for (let i = 1; i < 3; i++) {
              for (let j = 1; j < 3; j++) {
                const nx = x + (w * i) / 3;
                const ny = y + (h * j) / 3;
                ctx.beginPath();
                ctx.arc(nx, ny, 9, 0, 6.3);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(nx, ny, 12, 0, 6.3);
                ctx.stroke();
              }
            }
          }
        } else if (mode === "golden") {
          const p = 0.618;
          if (transformIdx % 2 === 0) {
            line(x + w * p, y, x + w * p, y + h);
            line(x + w * (1 - p), y, x + w * (1 - p), y + h);
            line(x, y + h * p, x + w, y + h * p);
            line(x, y + h * (1 - p), x + w, y + h * (1 - p));
          } else {
            const phis = [0.236, 0.382, 0.618, 0.764];
            ctx.setLineDash([5, 5]);
            phis.forEach((pos) => {
              line(x + w * pos, y, x + w * pos, y + h);
              line(x, y + h * pos, x + w, y + h * pos);
            });
            ctx.setLineDash([]);
          }
        } else if (mode === "tri-aureos") {
          line(x, y + h, x + w, y);
          const dx = w,
            dy = -h;
          const t1 = (-h * dy) / (dx * dx + dy * dy);
          line(x, y, x + t1 * dx, y + h + t1 * dy);
          const t2 = (w * dx) / (dx * dx + dy * dy);
          line(x + w, y + h, x + t2 * dx, y + h + t2 * dy);
        } else if (mode === "espiral") {
          const phi = 1.61803398875;
          let th = h,
            tw = h / phi;
          if (tw > w) {
            tw = w;
            th = w * phi;
          }
          let cX = x + (w - tw) / 2;
          let cY = y + (h - th) / 2;
          let cW = tw,
            cH = th;

          for (let j = 0; j < 10; j++) {
            let i = (j + 1) % 4;
            let s = Math.min(cW, cH);
            if (s < 1) break;
            let sqX = cX,
              sqY = cY;
            if (i === 2) sqX = cX + cW - s;
            if (i === 3) sqY = cY + cH - s;
            ctx.save();
            ctx.globalAlpha = 0.4;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.rect(sqX, sqY, s, s);
            ctx.stroke();
            ctx.restore();
            ctx.beginPath();
            if (i === 0) {
              ctx.arc(sqX + s, sqY + s, s, Math.PI, 1.5 * Math.PI);
              cX += s;
              cW -= s;
            } else if (i === 1) {
              ctx.arc(sqX, sqY + s, s, 1.5 * Math.PI, 2 * Math.PI);
              cY += s;
              cH -= s;
            } else if (i === 2) {
              ctx.arc(sqX, sqY, s, 0, 0.5 * Math.PI);
              cW -= s;
            } else if (i === 3) {
              ctx.arc(sqX + s, sqY, s, 0.5 * Math.PI, Math.PI);
              cH -= s;
            }
            ctx.stroke();
          }
        } else if (mode === "diagonales") {
          const state = transformIdx % 4;
          const s = 20;
          function marca45(cornerX, cornerY, dirX, dirY, s) {
            ctx.save();
            ctx.globalAlpha = 0.5;
            const cx = cornerX + dirX * s * 0.5;
            const cy = cornerY + dirY * s * 0.5;
            line(
              cx - dirX * s * 0.5,
              cy + dirY * s * 0.5,
              cx + dirX * s * 0.5,
              cy - dirY * s * 0.5,
            );
            ctx.restore();
          }
          if (state === 0) {
            line(x + w, y, x, y + h);
          } else if (state === 1) {
            if (w > h) {
              line(x, y, x + h, y + h);
              marca45(x, y, +1, +1, s);
              line(x + w, y + h, x + w - h, y);
              marca45(x + w, y + h, -1, -1, s);
            } else {
              line(x, y, x + w, y + w);
              marca45(x, y, +1, +1, s);
              line(x + w, y + h, x, y + h - w);
              marca45(x + w, y + h, -1, -1, s);
            }
          } else if (state === 2) {
            line(x, y, x + w, y + h);
          } else if (state === 3) {
            if (w > h) {
              line(x + w, y, x + w - h, y + h);
              marca45(x + w, y, -1, +1, s);
              line(x, y + h, x + h, y);
              marca45(x, y + h, +1, -1, s);
            } else {
              line(x + w, y, x, y + w);
              marca45(x + w, y, -1, +1, s);
              line(x, y + h, x + w, y + h - w);
              marca45(x, y + h, +1, -1, s);
            }
          }
        } else if (mode === "fuga") {
          const fx = x + w * fugaX,
            fy = y + h * fugaY;
          ctx.setLineDash([5, 5]);
          line(x, fy, x + w, fy);
          line(fx, y, fx, y + h);
          ctx.setLineDash([]);
          line(x, y, fx, fy);
          line(x + w, y, fx, fy);
          line(x, y + h, fx, fy);
          line(x + w, y + h, fx, fy);
          const elapsed = time - pulseStartTime;
          if (elapsed < 1000) {
            const pulse = Math.abs(Math.sin(elapsed / 200));
            ctx.beginPath();
            ctx.arc(fx, fy, 5 + pulse * 10, 0, 7);
            ctx.strokeStyle = colors[cIdx];
            ctx.globalAlpha = 1 - pulse;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          ctx.fillStyle = colors[cIdx];
          ctx.beginPath();
          ctx.arc(fx, fy, 5, 0, 7);
          ctx.fill();
        } else if (mode === "horizonte") {
          const numLineas = 10;
          ctx.setLineDash([]);
          ctx.globalAlpha = 0.8;
          if (horMode === "H") {
            const hy = y + h * horY;
            ctx.lineWidth = 2.5;
            line(x, hy, x + w, hy);
            for (let i = 1; i <= numLineas; i++) {
              const offset = Math.pow(i / numLineas, 2.0);
              const ySuelo = hy + (y + h - hy) * offset;
              ctx.lineWidth = 1.5 * (1 - offset + 0.2);
              line(x, ySuelo, x + w, ySuelo);
            }
          } else {
            const vx = x + w * fugaX;
            ctx.lineWidth = 2.5;
            line(vx, y, vx, y + h);
            for (let i = 1; i <= numLineas; i++) {
              const offset = Math.pow(i / numLineas, 2.0);
              const xPared = vx - (vx - x) * offset;
              ctx.lineWidth = 1.5 * (1 - offset + 0.2);
              line(xPared, y, xPared, y + h);
            }
          }
          ctx.globalAlpha = 1.0;
        } else if (mode === "reframe") {
          const x1 = Math.round(x + w * frameX1);
          const y1 = Math.round(y + h * frameY1);
          const x2 = Math.round(x + w * frameX2);
          const y2 = Math.round(y + h * frameY2);
          ctx.fillStyle = "rgba(0,0,0,0.75)";
          ctx.fillRect(x, y, w, y1 - y);
          ctx.fillRect(x, y1, x1 - x, y2 - y1);
          ctx.fillRect(x2, y1, x + w - x2, y2 - y1);
          ctx.fillRect(x, y2, w, y + h - y2);
          const s = 16;
          ctx.strokeStyle = colors[cIdx];
          ctx.lineWidth = 1;
          line(x1 - s, y1, x1 + s, y1);
          line(x1, y1 - s, x1, y1 + s); // + TL
          line(x2 + s, y2, x2 - s, y2);
          line(x2, y2 + s, x2, y2 - s); // + BR
        }
      }

      function line(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      // --- EVENTOS ---

      document.getElementById("action-local").onclick = () => {
        toggleFullScreen(); // Llamada al cargar local
        fileInput.click();
      };
      document.getElementById("action-museum").onclick = loadMuseumArt;
      document.getElementById("action-photo").onclick = loadRandomPhoto;

      btnChange.onclick = () => {
        splash.style.display = "flex";
        topUI.style.display = "none";
        controls.style.display = "none";
      };

      const gridMenu = document.getElementById("grid-menu");

      function buildGridMenu() {
        gridMenu.innerHTML = "";

        gridLabels.forEach((label, index) => {
          const item = document.createElement("div");
          item.className = `grid-menu-item ${index === gIdx ? "active" : ""}`;
          item.innerText = label;

          item.onclick = (e) => {
            e.stopPropagation();
            setGrid(index);
            gridMenu.style.display = "none";
          };
          gridMenu.appendChild(item);
        });
      }

      function setGrid(index) {
        gIdx = index;
        btnGrid.firstChild.textContent = gridLabels[gIdx] + " ";
        transformIdx = 0;
        if (grids[gIdx] === "fuga") pulseStartTime = performance.now();
        if (grids[gIdx] === "reframe") initFrameCompL();
        if (grids[gIdx] === "paleta") {
          paletteDirty = true;
        }
        const noTransform = ["fuga", "focus", "reframe"].includes(grids[gIdx]);
        btnTransform.style.opacity = noTransform ? "0.5" : "1";
        btnTransform.style.pointerEvents = noTransform ? "none" : "auto";
        buildGridMenu();
      }

      buildGridMenu();

      btnGrid.onclick = (e) => {
        e.stopPropagation();

        buildGridMenu();
        const isOpen = gridMenu.style.display === "block";
        gridMenu.style.display = isOpen ? "none" : "block";
      };

      document.addEventListener("click", (e) => {
        if (!btnGrid.contains(e.target)) {
          gridMenu.style.display = "none";
        }
      });

      btnTransform.onclick = () => {
        if (grids[gIdx] === "masas") {
          mInvert = !mInvert;
        } else if (grids[gIdx] === "horizonte") {
          horMode = horMode === "H" ? "V" : "H";
        } else if (["fuga", "reframe", "focus"].includes(grids[gIdx])) {
          transformIdx = 0;
        } else if (grids[gIdx] === "paleta") {
          paletteDirty = true;
          generatePalette();
          transformIdx = 0;
        } else {
          transformIdx = (transformIdx + 1) % 4;
        }
      };

      document.getElementById("btn-color").onclick = () => {
        cIdx = (cIdx + 1) % colors.length;
        document.getElementById("color-dot").style.backgroundColor =
          colors[cIdx];
      };

      const btnReset = document.getElementById("btn-reset");
      btnReset.onmousedown = btnReset.ontouchstart = (e) => {
        isBypass = true;
        if (e.cancelable) e.preventDefault();
      };

      btnReset.onmouseup = btnReset.ontouchend = () => {
        toggleFullScreen();
        isBypass = false;
        centerImage();
      };

      canvas.addEventListener("touchstart", handleStart, { passive: false });
      canvas.addEventListener("touchmove", handleMove, { passive: false });
      canvas.addEventListener("touchend", () => (isDragging = false));
      canvas.addEventListener("mousedown", handleStart);
      window.addEventListener("mousemove", handleMove);
      window.addEventListener("mouseup", () => (isDragging = false));
    </script>
  </body>
