<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizar Composición</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .btn {
            background-color: #fff;
            color: #000;
            text-decoration: none;
            padding: 18px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn:hover {
            background-color: #ddd;
        }

        /* Estilos para los íconos SVG */
        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Analizar Composición</h1>
        <p>Selecciona la herramienta que deseas utilizar.</p>

        <div class="btn-group">
            <a href="utilidad1.html" class="btn">
                🔴 Usar la Cámara
            </a>

            <a href="utilidad2.html" class="btn">
                🟦 Cargar Imágenes
            </a>
        </div>
    </div>

</body>
</html>
